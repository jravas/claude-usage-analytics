[package]
name = "usage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reads Claude Code transcripts into a local token-usage index and answers usage queries."

[lib]
path = "src/lib.rs"

[[bin]]
name = "usage"
path = "src/bin/usage.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rayon = "1"
jiff = "0.2"
thiserror = "2"
memchr = "2"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
